<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Cake Gradients -->
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd369"/>
      <stop offset="100%" stop-color="#f6d365"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="40%" stop-color="#ffa502"/>
      <stop offset="100%" stop-color="#ffeaa7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Plate / Base -->
  <ellipse cx="32" cy="56" rx="28" ry="5" fill="#e0a899" opacity="0.8"/>
  <ellipse cx="32" cy="55" rx="26" ry="4" fill="#ffffff" opacity="0.9"/>

  <!-- Bottom Tier -->
  <rect x="12" y="38" width="40" height="15" rx="4" fill="url(#cakeGrad)"/>
  <!-- Bottom Frosting Drip -->
  <path d="M12,41 Q17,45 22,41 Q27,46 32,41 Q37,46 42,41 Q47,45 52,41 L52,38 L12,38 Z" fill="#ffffff"/>

  <!-- Top Tier -->
  <rect x="18" y="24" width="28" height="15" rx="4" fill="url(#frostingGrad)"/>
  <!-- Top Frosting Drip -->
  <path d="M18,27 Q22,31 27,27 Q32,32 37,27 Q41,31 46,27 L46,24 L18,24 Z" fill="#ffffff"/>

  <!-- Sprinkles -->
  <circle cx="20" cy="48" r="1.5" fill="#ff4757"/>
  <circle cx="28" cy="49" r="1.5" fill="#3742fa"/>
  <circle cx="36" cy="48" r="1.5" fill="#2ed573"/>
  <circle cx="44" cy="49" r="1.5" fill="#ffa502"/>

  <circle cx="24" cy="33" r="1.2" fill="#ffd369"/>
  <circle cx="32" cy="34" r="1.2" fill="#ffffff"/>
  <circle cx="40" cy="33" r="1.2" fill="#70a1ff"/>

  <!-- 3 Candles -->
  <!-- Left Candle -->
  <rect x="23" y="14" width="3" height="10" rx="1.5" fill="#70a1ff"/>
  <!-- Center Candle -->
  <rect x="30.5" y="11" width="3" height="13" rx="1.5" fill="#ff6b81"/>
  <!-- Right Candle -->
  <rect x="38" y="14" width="3" height="10" rx="1.5" fill="#2ed573"/>

  <!-- Wicks -->
  <line x1="24.5" y1="14" x2="24.5" y2="12" stroke="#333" stroke-width="1"/>
  <line x1="32" y1="11" x2="32" y2="9" stroke="#333" stroke-width="1"/>
  <line x1="39.5" y1="14" x2="39.5" y2="12" stroke="#333" stroke-width="1"/>

  <!-- Glowing Flames -->
  <path d="M24.5,6 C26,9 26,11 24.5,12 C23,11 23,9 24.5,6 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <path d="M32,3 C33.8,6.5 33.8,8.5 32,9.5 C30.2,8.5 30.2,6.5 32,3 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <path d="M39.5,6 C41,9 41,11 39.5,12 C38,11 38,9 39.5,6 Z" fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Sparkles -->
  <polygon points="10,16 11,19 14,20 11,21 10,24 9,21 6,20 9,19" fill="#ffd369" opacity="0.8"/>
  <polygon points="53,14 54,16.5 56.5,17.5 54,18.5 53,21 52,18.5 49.5,17.5 52,16.5" fill="#ffd369" opacity="0.8"/>
</svg>
